<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BookReader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>📚 BookReader</h1><input id="search" type="search" placeholder="Buscar título o autor…"></header>
  <main>
    <section class="card">
      <h2>Agregar resumen</h2>
      <form id="form">
        <input name="title" placeholder="Título del libro" required>
        <input name="author" placeholder="Autor">
        <textarea name="notes" placeholder="Notas (opcional)" rows="2"></textarea>
        <input name="audio" type="file" accept="audio/*" required>
        <button type="submit">Subir</button>
        <p id="msg"></p>
      </form>
    </section>
    <section>
      <h2>Biblioteca</h2>
      <div id="list"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
