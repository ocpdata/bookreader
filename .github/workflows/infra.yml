name: infra

# Manual: Terraform plan y, opcionalmente, apply de la infraestructura de BookReader (infra/).
# Recomendado: ejecutarlo primero con apply=false, revisar el plan en el resumen y luego con apply=true.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Aplicar los cambios (false = solo plan)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-bookreader
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TFC_TOKEN }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_s3_bucket_name: ${{ vars.S3_BUCKET || 'resumen-book-reader' }}
      TF_VAR_instance_type: ${{ vars.INSTANCE_TYPE }}
      TF_VAR_allowed_cidr_blocks: ${{ vars.ALLOWED_CIDR_BLOCKS }}
      TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
      TF_VAR_public_subnet_cidr: ${{ vars.PUBLIC_SUBNET_CIDR }}
      TF_VAR_db_instance_class: ${{ vars.DB_INSTANCE_CLASS }}
      TF_VAR_db_engine_version: ${{ vars.DB_ENGINE_VERSION }}
      TF_VAR_db_allocated_storage: ${{ vars.DB_ALLOCATED_STORAGE }}
      TF_VAR_db_name: ${{ vars.DB_NAME }}
      TF_VAR_db_username: ${{ secrets.DB_USER }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD || '25' }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      PRIVATE_SUBNET_1_CIDR: ${{ vars.PRIVATE_SUBNET_1_CIDR }}
      PRIVATE_SUBNET_2_CIDR: ${{ vars.PRIVATE_SUBNET_2_CIDR }}
      SSH_KEY_PEM: ${{ secrets.SSH_KEY_PEM }}
      TFC_ORG: ${{ vars.TFC_ORG }}
      TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required variables and secrets
        run: |
          missing=0
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION TF_TOKEN_app_terraform_io \
            TF_VAR_instance_type TF_VAR_allowed_cidr_blocks TF_VAR_vpc_cidr TF_VAR_public_subnet_cidr \
            PRIVATE_SUBNET_1_CIDR PRIVATE_SUBNET_2_CIDR TF_VAR_db_instance_class TF_VAR_db_engine_version \
            TF_VAR_db_allocated_storage TF_VAR_db_name TF_VAR_db_username TF_VAR_db_password \
            SSH_KEY_PEM TFC_ORG TFC_WORKSPACE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta la variable o el secret requerido: ${name}"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

          # El bloque cloud de versions.tf debe apuntar al workspace de BookReader.
          grep -q "organization = \"${TFC_ORG}\"" versions.tf || { echo "::error::versions.tf no usa la organización ${TFC_ORG}"; exit 1; }
          grep -q "name = \"${TFC_WORKSPACE}\"" versions.tf || { echo "::error::versions.tf no usa el workspace ${TFC_WORKSPACE}"; exit 1; }

      - name: Build Terraform inputs
        run: |
          echo "TF_VAR_private_subnet_cidrs=$(jq -cn --arg a "$PRIVATE_SUBNET_1_CIDR" --arg b "$PRIVATE_SUBNET_2_CIDR" '[$a,$b]')" >> "$GITHUB_ENV"

          key_file="$RUNNER_TEMP/bookreader_deploy"
          umask 077
          printf '%s\n' "$SSH_KEY_PEM" > "$key_file"
          echo "TF_VAR_ssh_public_key=$(ssh-keygen -y -f "$key_file")" >> "$GITHUB_ENV"
          echo "Huella de la llave SSH derivada: $(ssh-keygen -lf "$key_file")"
          rm -f "$key_file"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Plan summary
        run: |
          terraform show -no-color tfplan > plan.txt
          {
            echo "### Terraform plan"
            echo
            echo '```'
            grep -E '^Plan:|^No changes' plan.txt || true
            grep -E '^  # ' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform apply -input=false tfplan

      - name: Verify monitoring agent
        if: ${{ inputs.apply }}
        run: |
          instance="$(terraform output -raw instance_id)"
          document="$(terraform output -raw cloudwatch_agent_document_name)"
          for attempt in $(seq 1 30); do
            online="$(aws ssm describe-instance-information --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$instance" \
              --query 'InstanceInformationList[0].PingStatus' --output text)"
            [[ "$online" == "Online" ]] && break
            echo "Esperando Systems Manager ($attempt/30)..."
            sleep 10
          done
          if [[ "$online" != "Online" ]]; then
            echo "::error::Terraform se aplicó, pero la VM no está conectada a Systems Manager. Comprueba el agente y su conectividad."
            exit 1
          fi
          command_id="$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$instance" \
            --document-name "$document" --query 'Command.CommandId' --output text)"
          for attempt in $(seq 1 60); do
            status="$(aws ssm list-command-invocations --region "$AWS_REGION" --command-id "$command_id" \
              --query 'CommandInvocations[0].Status' --output text)"
            if [[ "$status" == "Success" ]]; then
              echo "Agente de CloudWatch configurado en $instance."
              exit 0
            fi
            if [[ "$status" == "Failed" || "$status" == "TimedOut" || "$status" == "Cancelled" || "$status" == "Cancelling" ]]; then
              aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$instance" --output json
              echo "::error::La configuración del agente falló ($status)."
              exit 1
            fi
            echo "Esperando configuración del agente ($attempt/60)..."
            sleep 10
          done
          echo "::error::Terraform se aplicó, pero no se confirmó el comando $command_id. Revisa Systems Manager."
          exit 1

      - name: Outputs
        if: ${{ inputs.apply }}
        run: |
          {
            echo "### Resultado"
            echo
            echo "- IP pública: \`$(terraform output -raw public_ip)\`"
            echo "- Endpoint RDS (privado): \`$(terraform output -raw db_host)\`"
            echo
            echo "Siguiente paso: ejecutar el workflow \`deploy\`."
          } >> "$GITHUB_STEP_SUMMARY"
