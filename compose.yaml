services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: bookreader
      MYSQL_DATABASE: bookreader
    ports:
      # 3307 en el host: el 3306 suele estar ocupado por un MySQL local.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
